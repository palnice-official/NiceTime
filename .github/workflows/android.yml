name: Android checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        shell: pwsh
        run: sdkmanager 'platforms;android-36' 'build-tools;34.0.0'
      - name: Build, unit tests, lint
        shell: pwsh
        run: .\gradlew.bat assembleDebug testDebugUnitTest :core:model:test lintDebug '-Pkotlin.compiler.execution.strategy=in-process'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-evidence
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/reports/
